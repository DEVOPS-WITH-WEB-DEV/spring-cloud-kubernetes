name: java pipeline

on:
    push:
        branches:
            feature

jobs:
    job1:
        runs-on: ubuntu-24.04-arm
        
        steps:
            - name: checkout latest code 
              uses: actions/checkout@v6
            
            - name: setup java
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '25'
                cache: 'maven'
                cache-dependency-path: './kubernetes-configmap-reload/pom.xml'
            - run: java --version

            - name: clean the project
              run: mvn clean

            - name: test the project
              run: mvn test

            - name: compile the project
              run: mvn build
             